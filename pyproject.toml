[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pendant-recorder"
version = "0.1.0"
description = "Local macOS tool that turns BLE audio pendant captures into transcripts and Markdown day files"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "limitless-pendant-client>=0.1.0",
    "mlx-whisper>=0.4.3",
    "click>=8",
    "tomli_w>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pendant-recorder = "pendant_recorder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end run on the real capture"]
