[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lavalier"
version = "1.0.0"
description = "Local macOS tool that turns BLE audio pendant captures into transcripts and Markdown day files"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "limitless-pendant-client>=0.1.0",
    "mlx-whisper>=0.4.3",
    "click>=8",
    "tomli_w>=1.0",
    "pywebview>=6.2",
    "anthropic>=2.3",
    "openai>=3.37",
    "google-genai>=2.33",
    "keyring>=25.7",
    "notion-client>=3.1",
    "pyobjc-framework-EventKit>=12.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
lavalier = "lavalier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lavalier = ["web/dist/*", "web/dist/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["slow: end-to-end run on the real capture"]
